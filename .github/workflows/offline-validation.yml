name: Offline runtime and funding audit

on:
  pull_request:
  push:
    branches: [codex/weekly-progress-20261119]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Run stdlib offline regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Rebuild date audit and no-network smoke plan
        run: |
          python3 scripts/audit_funding_dates.py
          # The Nov19 visual report uses frozen test-group counts; current validation is in shared-workflow.yml.
          python3 experiments/closed_loop_offline/weekly_smoke.py --plan-output /tmp/4511-current-smoke-plan.json
          git diff --exit-code -- data/weekly_audit_20261119 data/weekly_smoke_20261119
      - name: Exercise synthetic closed-loop outcomes
        run: python3 experiments/closed_loop_offline/run_fixtures.py /tmp/4511-fixture-runs.json
